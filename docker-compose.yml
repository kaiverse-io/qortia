# Full local stack: Postgres+pgvector, Ollama (embedding engine), the Qortia
# API, and its background worker. One command, everything qortia depends on:
#
#   docker compose up --build
#   just stack-pull-model     # ollama pull bge-m3 (once)
#
# API: http://localhost:8081/docs   (root redirects there too)
#
# Embeddings talk to Ollama directly — fine for single-tenant local dogfood
# per ADR-003. Need per-tenant virtual keys / budgets / OTel attribution
# instead? Add the optional gateway on top (separate file, not a profile —
# it also needs to repoint app/worker at it, which a profile flag alone
# can't do):
#
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up --build
#
# db, app and worker all build from a Dockerfile that COPYs their own source
# in rather than bind-mounting it — some Docker hosts refuse bind mounts
# entirely (Docker Desktop's file-sharing allowlist not covering the
# workspace, for example), which otherwise silently breaks migrations and
# the app image. Everything shares one explicitly-named network (`qortia_net`
# below, not compose's own auto-generated `<project>_default`, whose name
# depends on the directory this happens to be checked out into) — no other
# project's containers are ever on it. Reached from outside (e.g. another
# project's container) only via a published port on the host, never shared
# network membership — the same HTTP-only contract a real deployment would
# have.
#
# Note for anyone iterating on the app itself without rebuilding images:
# `.env` (see .env.example) is for that host-run workflow only — QORTIA_*
# values there are host-appropriate (127.0.0.1 ports) and deliberately not
# read by the services below, which hardcode their own in-network values.
# Docker Compose auto-loads `.env` from this directory for either purpose,
# so the two must never share a variable name with different intended
# values, or one silently clobbers the other.

services:
  db:
    build: ./migrations
    environment:
      POSTGRES_DB: qortia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    ports:
      - "5434:5432"
    volumes:
      - qortia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qortia"]
      interval: 2s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:0.9.6
    ports:
      - "11434:11434"
    volumes:
      # Named volume by default; override with host cache if you've already
      # pulled models (e.g. OLLAMA_MODELS_DIR=$HOME/.ollama).
      - ${OLLAMA_MODELS_DIR:-qortia-ollama}:/root/.ollama
    # CPU-only is fine for smoke; attach a GPU device in prod-like hosts.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      QORTIA_DATABASE_URL: postgresql://qortia_platform:qortia_platform@db:5432/qortia
      # Ollama's own OpenAI-compatible endpoint. Not a `${...}` override —
      # see the file-level note above on why this can't share a name with
      # .env's host-oriented value.
      QORTIA_LITELLM_URL: http://ollama:11434/v1
      QORTIA_EMBEDDING_MODEL: ${QORTIA_EMBEDDING_MODEL:-bge-m3}
      QORTIA_EMBEDDING_DIMENSION: ${QORTIA_EMBEDDING_DIMENSION:-1024}
      # Unset = /v1/admin/* not mounted at all (ADR-004). Set to enable HTTP
      # tenant/agent/key provisioning for callers with no shell into this box.
      QORTIA_ADMIN_TOKEN: ${QORTIA_ADMIN_TOKEN:-}
      QORTIA_EVAL_MODE: ${QORTIA_EVAL_MODE:-false}
      # Unset (default) = reranking skipped, not attempted against nothing —
      # see config.Settings.rerank_model. .env alone does NOT reach this
      # container; compose only passes vars explicitly listed here, so this
      # line existing is what makes QORTIA_RERANK_MODEL=... in .env actually
      # take effect (found live: .env had a value set that silently never
      # reached app/worker until this line was added).
      QORTIA_RERANK_MODEL: ${QORTIA_RERANK_MODEL:-}
    ports:
      - "${QORTIA_APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker:
    build: .
    command: ["qortia-worker"]
    environment:
      QORTIA_DATABASE_URL: postgresql://qortia_platform:qortia_platform@db:5432/qortia
      QORTIA_LITELLM_URL: http://ollama:11434/v1
      QORTIA_EMBEDDING_MODEL: ${QORTIA_EMBEDDING_MODEL:-bge-m3}
      QORTIA_EMBEDDING_DIMENSION: ${QORTIA_EMBEDDING_DIMENSION:-1024}
      # The background reflection trigger (run_background_reflection_trigger,
      # workers.py) runs in *this* container, not app — missing here means
      # reflection silently never had a model regardless of what app or
      # .env had set, which is exactly how this went unnoticed: only found
      # by directly checking `docker exec qortia-worker-1 env`, not by
      # reasoning about the compose file.
      QORTIA_RERANK_MODEL: ${QORTIA_RERANK_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

networks:
  default:
    name: qortia_net

volumes:
  qortia-pgdata:
  qortia-ollama:
