repos:
  # Secret scanning — blocks leaks before they hit the remote
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python linting + formatting (Astral)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies:
          - fastapi>=0.115
          - httpx>=0.27
          - asyncpg>=0.29
          - pydantic>=2.9
          - cachetools>=5.5
          - types-cachetools
          - pyyaml>=6.0
          - types-PyYAML

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  # Conventional commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Dependency vulnerability scan (runs on push, not commit — slow)
  - repo: https://github.com/google/osv-scanner
    rev: v1.9.1
    hooks:
      - id: osv-scanner
        stages: [pre-push]

  # Architecture boundary enforcement (slot — fill .importlinter)
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture boundaries)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false

  # Custom semantic rules (opengrep — self-weakening guard + project rules)
  - repo: local
    hooks:
      - id: opengrep
        name: opengrep (self-weakening + project rules)
        # Requires opengrep in PATH — installed by .devcontainer/post-create.sh
        entry: bash -c 'command -v opengrep >/dev/null 2>&1 && opengrep scan --config .opengrep/rules/ . || (echo "[warn] opengrep not installed — skipping (run post-create.sh)" && exit 0)'
        language: system
        pass_filenames: false
        stages: [pre-commit]
