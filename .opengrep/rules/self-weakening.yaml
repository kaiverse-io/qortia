rules:
  # Agents must not bypass pre-commit hooks — fix the violation instead.
  - id: agent-no-skip-verify
    languages: [generic]
    pattern-regex: "--no-verify"
    message: >
      Self-weakening: --no-verify bypasses pre-commit hooks.
      Fix the violation; never skip the check.
    severity: ERROR
    paths:
      exclude:
        - "**/*.md"
        - "**/*.md.jinja"
        - "**/AGENTS.md*"
        - "**/CONTRIBUTING.md*"
        - ".opengrep/**"
        - "template/.opengrep/**"
        # The permissions.deny rule / Codex prefix_rule that blocks --no-verify necessarily
        # contains the literal string it blocks — this is the rule's own enforcement, not
        # a violation.
        - "**/settings.json.jinja"
        - ".claude/settings.json"
        - "**/.codex/rules/**"
    metadata:
      category: security
      technology: [git]

  # Agents must not silence CI failures with continue-on-error.
  - id: agent-no-continue-on-error
    languages: [yaml]
    pattern-regex: "continue-on-error:\\s*true"
    message: >
      Self-weakening: continue-on-error silences CI failures.
      Fix the failing step instead.
    severity: ERROR
    paths:
      exclude:
        - "**/*.md"
        - "**/*.md.jinja"
        - "**/AGENTS.md*"
        - "**/CONTRIBUTING.md*"
        - ".opengrep/**"
        - "template/.opengrep/**"
    metadata:
      category: security
      technology: [github-actions]

  # Bare # noqa suppresses all lint on a line — require specific codes.
  - id: agent-no-bare-noqa
    languages: [python]
    pattern-regex: "#\\s*noqa\\s*$"
    message: >
      Self-weakening: bare # noqa suppresses all lint.
      Use specific codes with a reason (e.g. # noqa: E501  # line too long by design).
    severity: ERROR
    metadata:
      category: maintainability

  # Agents must not disable pre-commit by uninstalling it.
  - id: agent-no-precommit-uninstall
    languages: [generic]
    pattern-regex: "pre-commit\\s+uninstall"
    message: >
      Self-weakening: pre-commit uninstall removes all hooks.
      This is forbidden. Fix the hook failure instead.
    severity: ERROR
    paths:
      exclude:
        - "**/*.md"
        - "**/*.md.jinja"
        - "**/AGENTS.md*"
        - "**/CONTRIBUTING.md*"
        - ".opengrep/**"
        - "template/.opengrep/**"
    metadata:
      category: security
      technology: [pre-commit]

  # Deliberately WARNING, not ERROR — do not promote without also changing the default
  # stamp: `just accept`'s default parameterization intentionally renders fail_under = 0
  # (a fresh project has no tests yet), and `just accept` runs `just ci` --severity ERROR
  # against its own stamped output. Promoting this rule to ERROR would make chassis's
  # own acceptance test fail on the default answer set. If the ratchet default ever
  # changes, revisit this severity in the same change.
  # generic: opengrep has no toml language.
  - id: agent-no-lower-coverage-floor
    languages: [generic]
    paths:
      include:
        - "**/pyproject.toml"
    patterns:
      - pattern-regex: "fail_under\\s*=\\s*0"
    message: >
      Coverage floor is 0 — the ratchet is unset. Raise fail_under to at least
      the current measured coverage percentage and never lower it.
    severity: WARNING
    metadata:
      category: quality
