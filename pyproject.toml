[project]
name = "qortia"
version = "0.1.0"
description = "Portable memory layer for AI agents — Postgres+pgvector native. Hybrid lexical+vector recall with RRF fusion, entity-graph traversal, background consolidation, and outcome-linked confidence decay."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "km2411" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "C901", "UP", "B", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=qortia",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]

[tool.coverage.run]
source = ["qortia"]
branch = true

[tool.coverage.report]
# Ratchet (bucket B): only increase this value, never decrease it.
fail_under = 0
